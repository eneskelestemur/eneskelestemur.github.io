name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the GitHub star/fork counts daily even without a push.
  # Note: GitHub disables scheduled workflows after 60 days of repo inactivity.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Refresh star/fork counts before building. GITHUB_TOKEN raises the API
      # limit from 60 to 5000 req/hr; the script never fails the build.
      - run: node scripts/fetch-github-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
