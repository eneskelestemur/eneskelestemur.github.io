    <meta property="og:site_name" content="Enes Kelestemur" />

    />
    <meta name="twitter:image" content="https://eneskelestemur.github.io/og-image.png" />

    <!--
      GitHub Pages has no SPA fallback, so a deep link like /research is served
      as a 404. 404.html stores the requested path and redirects here; this
      script restores it before React Router mounts.
    -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spaRedirect');
        if (redirect) {
          sessionStorage.removeItem('spaRedirect');
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
